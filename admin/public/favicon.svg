<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Sleek Indigo Admin Theme) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" />
  <!-- Admin Cloche + Gear Icon -->
  <g filter="url(#dropShadow)">
    <!-- Plate Base -->
    <rect x="136" y="320" width="240" height="20" rx="10" fill="#ffffff" />
    <!-- Dome Cover -->
    <path d="M156 300 C156 190, 356 190, 356 300 Z" fill="#ffffff" opacity="0.9" />
    <!-- Handle Ring -->
    <circle cx="256" cy="180" r="16" stroke="#ffffff" stroke-width="8" fill="none" />
    <!-- Gear / Admin Emblem in center of Dome -->
    <circle cx="256" cy="260" r="22" fill="#4f46e5" />
    <circle cx="256" cy="260" r="12" fill="#ffffff" />
    <!-- Gear Teeth -->
    <rect x="251" y="230" width="10" height="10" rx="2" fill="#4f46e5" />
    <rect x="251" y="280" width="10" height="10" rx="2" fill="#4f46e5" />
    <rect x="226" y="255" width="10" height="10" rx="2" fill="#4f46e5" />
    <rect x="276" y="255" width="10" height="10" rx="2" fill="#4f46e5" />
  </g>
</svg>
